name: APISIX Continuous Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "config/**/*.yaml"
      - "config/**/*.yml"
      - "plugins/**/*.lua"
      - "pruebas/**"
      - ".github/workflows/ci-apisix.yml"

jobs:
  validate-and-test:
    name: Validate APISIX configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint YAML configuration
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: "config"
          config_data: |
            extends: default
            rules:
              braces:
                min-spaces-inside: 1
                max-spaces-inside: 1
              line-length:
                max: 140

      - name: Require standalone end marker
        run: |
          test "$(tail -n 1 config/apisix.yaml | tr -d '\r\n')" = "#END"

      - name: Start isolated mock services
        run: |
          docker network create apisix-ci
          printf '%s\n' 'integration-test-secret' > "$RUNNER_TEMP/gateway-secret"

          docker run -d --name identity-service-ci \
            --network apisix-ci \
            --network-alias identity-service \
            -p 127.0.0.1:8081:8080 \
            -v "${{ github.workspace }}/pruebas/mock_identity.py:/app/mock_identity.py:ro" \
            python:3.12-alpine python /app/mock_identity.py

          docker run -d --name campaign-service-ci \
            --network apisix-ci \
            --network-alias campaign-service \
            python:3.12-alpine \
            python -m http.server 8082 --bind 0.0.0.0

          docker run -d --name donation-service-ci \
            --network apisix-ci \
            --network-alias donation-service \
            python:3.12-alpine \
            python -m http.server 8083 --bind 0.0.0.0

      - name: Start APISIX with repository configuration and plugin
        run: |
          docker run -d --name apisix-ci-test \
            --network apisix-ci \
            -v "${{ github.workspace }}/config/config.yaml:/usr/local/apisix/conf/config.yaml:ro" \
            -v "${{ github.workspace }}/config/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro" \
            -v "${{ github.workspace }}/plugins:/usr/local/apisix/custom:ro" \
            -v "$RUNNER_TEMP/gateway-secret:/run/secrets/gateway-secreto-cliente:ro" \
            -e APISIX_STANDALONE=true \
            -p 9080:9080 \
            apache/apisix:3.19.0-debian

          for attempt in $(seq 1 30); do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:9080/ || true)
            if [ -n "$status" ] && [ "$status" != "000" ]; then
              exit 0
            fi
            sleep 1
          done

          docker logs apisix-ci-test
          exit 1

      - name: Check APISIX startup logs
        if: success()
        run: |
          if docker logs apisix-ci-test 2>&1 | grep -iE "error|fatal"; then
            echo "APISIX reported a configuration or plugin loading error."
            exit 1
          fi

      - name: Verify unauthenticated 401 reaches Identity audit
        run: bash pruebas/t-305.4-401-audit.sh

      - name: Stop integration containers
        if: always()
        run: |
          docker logs apisix-ci-test 2>&1 || true
          docker rm -f apisix-ci-test identity-service-ci campaign-service-ci donation-service-ci 2>/dev/null || true
          docker network rm apisix-ci 2>/dev/null || true
