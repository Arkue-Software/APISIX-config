name: Deploy on release/*

on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: read

env:
  ROOT_DIR: /home/runner/Downloads/RedVital/Despliegue_RedVital
  QA_HOST: https://10.43.98.220

jobs:
  validate:
    name: Quick validate (only on service repos)
    runs-on: [self-hosted, linux, vm-servicios]
    if: contains(github.repository, 'Arkue-Software/identity') || contains(github.repository, 'Arkue-Software/donation') || contains(github.repository, 'Arkue-Software/campaign') || contains(github.repository, 'Arkue-Software/frontend') || contains(github.repository, 'Arkue-Software/APISIX-config') || contains(github.repository, 'Arkue-Software/databases')
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner & environment
        run: |
          echo "Repo: $GITHUB_REPOSITORY"
          echo "Runner home: $RUNNER_HOME"
          uname -a
          id

      - name: Quick disk and docker status
        run: |
          df -h .
          docker version
          docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

  migrate:
    name: Apply DB migrations (vm-datos)
    runs-on: [self-hosted, linux, vm-datos]
    if: github.repository == 'Arkue-Software/databases'
    concurrency:
      group: deploy-vm-datos
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain deploy lock (vm-datos)
        run: |
          LOCKDIR=/tmp/deploy-lock-vm-datos
          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "Another deployment is running on vm-datos; waiting..."
            sleep 5
          done
          echo "LOCKED" > "$LOCKDIR/owner"
        shell: bash

      - name: Run migrations (docker-compose up -d)
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          set -euo pipefail
          docker compose -f vm-datos/docker-compose.yml --env-file ambientes/qa.env up -d
          sleep 3
          docker compose -f vm-datos/docker-compose.yml --env-file ambientes/qa.env ps -a
          echo "Waiting a few seconds for migrations to complete..."
          sleep 6
          docker compose -f vm-datos/docker-compose.yml --env-file ambientes/qa.env ps --format '{{.Name}} {{.State}}' | grep -E 'migracion|semilla' || true
        shell: bash

      - name: Release deploy lock (vm-datos)
        if: always()
        run: |
          rm -rf /tmp/deploy-lock-vm-datos || true

  deploy-services:
    name: Build & Deploy Services (vm-servicios)
    runs-on: [self-hosted, linux, vm-servicios]
    if: github.repository == 'Arkue-Software/identity' || github.repository == 'Arkue-Software/donation' || github.repository == 'Arkue-Software/campaign'
    concurrency:
      group: deploy-vm-servicios
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain deploy lock (vm-servicios)
        run: |
          LOCKDIR=/tmp/deploy-lock-vm-servicios
          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "Another deployment is running on vm-servicios; waiting..."
            sleep 5
          done
          echo "LOCKED" > "$LOCKDIR/owner"
        shell: bash

      - name: Determine service name
        id: svc
        run: |
          case "${GITHUB_REPOSITORY}" in
            "Arkue-Software/identity") echo "service=identity-service" > props;;
            "Arkue-Software/campaign") echo "service=campaign-service" > props;;
            "Arkue-Software/donation") echo "service=donation-service" > props;;
            *) echo "service=all" > props;;
          esac
          cat props
        shell: bash

      - name: Deploy service via docker compose
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          set -euo pipefail
          source ./props
          echo "Deploying service: $service"
          if [ "$service" = "all" ]; then
            docker compose -f vm-servicios/docker-compose.yml --env-file ambientes/qa.env up -d --build
          else
            docker compose -f vm-servicios/docker-compose.yml --env-file ambientes/qa.env up -d --build "$service"
          fi
          sleep 5
          docker compose -f vm-servicios/docker-compose.yml --env-file ambientes/qa.env ps -a
        shell: bash

      - name: Service-specific health check
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          set -euo pipefail
          source ./props
          case "$service" in
            identity-service)
              curl -f http://127.0.0.1:8080/salud || (docker compose -f vm-servicios/docker-compose.yml --env-file ambientes/qa.env logs --tail 200 identity-service; exit 1)
              ;;
            campaign-service)
              curl -f http://127.0.0.1:8082/salud || (docker compose -f vm-servicios/docker-compose.yml --env-file ambientes/qa.env logs --tail 200 campaign-service; exit 1)
              ;;
            donation-service)
              curl -f http://127.0.0.1:8183/actuator/health/readiness || (docker compose -f vm-servicios/docker-compose.yml --env-file ambientes/qa.env logs --tail 200 donation-service; exit 1)
              ;;
            all)
              echo "No specific service requested, basic ps shown above."
              ;;
          esac
        shell: bash

      - name: Release deploy lock (vm-servicios)
        if: always()
        run: |
          rm -rf /tmp/deploy-lock-vm-servicios || true

  deploy-edge:
    name: Deploy Frontend / APISIX / Caddy (vm-borde)
    runs-on: [self-hosted, linux, vm-borde]
    if: github.repository == 'Arkue-Software/frontend' || github.repository == 'Arkue-Software/APISIX-config'
    concurrency:
      group: deploy-vm-borde
      cancel-in-progress: false
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Obtain deploy lock (vm-borde)
        run: |
          LOCKDIR=/tmp/deploy-lock-vm-borde
          while ! mkdir "$LOCKDIR" 2>/dev/null; do
            echo "Another deployment is running on vm-borde; waiting..."
            sleep 5
          done
          echo "LOCKED" > "$LOCKDIR/owner"
        shell: bash

      - name: Deploy edge components
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REPOSITORY}" = "Arkue-Software/frontend" ]; then
            docker compose -f vm-borde/docker-compose.yml --env-file ambientes/qa.env up -d --build web
            sleep 3
          fi
          if [ "${GITHUB_REPOSITORY}" = "Arkue-Software/APISIX-config" ]; then
            docker compose -f vm-borde/docker-compose.yml --env-file ambientes/qa.env restart apisix || true
            sleep 3
          fi
          docker compose -f vm-borde/docker-compose.yml --env-file ambientes/qa.env up -d --build caddy || true
          sleep 3
          docker compose -f vm-borde/docker-compose.yml --env-file ambientes/qa.env ps -a
        shell: bash

      - name: Edge smoke check (via QA host)
        run: |
          set -euo pipefail
          CA_FILE="${{ env.ROOT_DIR }}/redvital-qa-raiz.crt"
          if [ -f "$CA_FILE" ]; then
            curl -sS --cacert "$CA_FILE" "${QA_HOST}/api/v1/campanias" | head -c 200; echo
          else
            echo "CA file not found at $CA_FILE; trying insecure curl (not recommended)"
            curl -ks "${QA_HOST}/api/v1/campanias" | head -c 200; echo
          fi
        shell: bash

      - name: Release deploy lock (vm-borde)
        if: always()
        run: |
          rm -rf /tmp/deploy-lock-vm-borde || true

  e2e:
    name: End-to-end tests (vm-servicios)
    runs-on: [self-hosted, linux, vm-servicios]
    needs: [migrate, deploy-services, deploy-edge]
    timeout-minutes: 20
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run E2E script (from Despliegue_RedVital)
        working-directory: ${{ env.ROOT_DIR }}
        run: |
          set -euo pipefail
          python3 pruebas/extremo_a_extremo.py --base "${QA_HOST}" --ca redvital-qa-raiz.crt --secretos secretos/qa
        shell: bash

  notify:
    name: Notify (optional)
    runs-on: [self-hosted, linux, vm-servicios]
    needs: [e2e]
    if: always()
    steps:
      - name: Notify Slack (if webhook secret exists)
        env:
          WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK || '' }}
        run: |
          if [ -n "$WEBHOOK" ]; then
            STATUS="success"
            if [ "${{ needs.e2e.result }}" != "success" ]; then STATUS="failure"; fi
            payload="{\"text\":\"Deployment on ${GITHUB_REF} for ${GITHUB_REPOSITORY} finished: ${STATUS}\"}"
            curl -sS -X POST -H 'Content-type: application/json' --data "$payload" "$WEBHOOK" || true
          else
            echo "NOTIFY_WEBHOOK not set; skipping notification."
          fi
        shell: bash